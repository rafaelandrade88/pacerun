# PaceRun — Netlify config
# O build roda LOCALMENTE (node build.js no seu PC).
# O Netlify só publica o dist/ já pronto — zero créditos de build.

[build]
  # Sem comando de build — Netlify só publica o dist/
  command = ""
  publish = "dist"

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Service Worker sem cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control          = "no-cache"
    Service-Worker-Allowed = "/"
