# PaceRun — Netlify config
# Build roda LOCALMENTE (node build.js no PC).
# Netlify só publica o dist/ — zero créditos de build.

[build]
  command = ""
  publish = "dist"

# Service Worker sem cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control          = "no-cache"
    Service-Worker-Allowed = "/"

# Headers de segurança — SEM X-Frame-Options
# (bloqueava o popup de login do Google)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"